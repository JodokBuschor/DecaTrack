<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DecaTrack" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="Lokales, frei konfigurierbares Trainingstagebuch für Disziplin- und Krafttraining." />
  <title>DecaTrack – Trainingstagebuch</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">TRAININGSTAGEBUCH</p>
        <h1 id="page-title">DecaTrack</h1>
      </div>
      <button class="icon-btn" id="quick-add-btn" aria-label="Training hinzufügen" hidden>＋</button>
    </header>

    <main id="app" class="content"></main>

    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <button class="nav-item active" data-route="dashboard">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M7 14h2M12 14h2M17 14h1M7 18h2M12 18h2"/></svg>
        </span><span>Kalender</span>
      </button>
      <button class="nav-item" data-route="disciplines">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
        </span><span>Disziplinen</span>
      </button>
      <button class="nav-item" data-route="strength">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12"/></svg>
        </span><span>Kraft</span>
      </button>
      <button class="nav-item" data-route="data">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v6c0 1.7 3.1 3 7 3s7-1.3 7-3V5M5 11v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>
        </span><span>Daten</span>
      </button>
    </nav>
  </div>

  <dialog id="entry-dialog" class="dialog">
    <form class="dialog-card" id="entry-form">
      <div class="dialog-head">
        <div>
          <p class="eyebrow" id="dialog-eyebrow">NEUER EINTRAG</p>
          <h2 id="dialog-title">Training</h2>
        </div>
        <button type="button" class="icon-btn ghost" id="close-dialog">×</button>
      </div>

      <div id="entry-dialog-accent" class="entry-dialog-accent">
        <label>
          Disziplin / Bereich
          <select id="entry-area-select" required></select>
        </label>
      </div>

      <input type="hidden" id="entry-discipline-id" />
      <input type="hidden" id="entry-kind" value="discipline" />

      <label>
        Datum
        <input id="entry-date" type="date" required />
      </label>

      <label>
        Training beschreiben
        <textarea id="entry-description" rows="6" placeholder="Was hast du trainiert? Was lief gut? Was willst du verbessern?" required></textarea>
      </label>

      <label>
        Leistung / Resultat <span class="label-note">(optional)</span>
        <input id="entry-result" type="text" placeholder="z. B. 10.98 s, 6.85 m, 5 × 30 m" />
      </label>

      <label class="competition-toggle">
        <input id="entry-competition" type="checkbox" />
        <span class="competition-check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg></span>
        <span class="competition-label"><strong>🏆 Als Wettkampf markieren</strong><small class="competition-hint-off">Normales Training</small><small class="competition-hint-on">Wettkampf ausgewählt</small></span>
        <span class="competition-state" aria-hidden="true"><span class="state-off">Aus</span><span class="state-on">Aktiv</span></span>
      </label>
      <p class="muted small" id="entry-autosave">Entwurf wird automatisch gespeichert.</p>

      <div class="rating-field">
        <div class="rating-label">Training bewerten</div>
        <p class="rating-help" id="rating-help"></p>
        <div class="rating-scale-wide">
          <button type="button" class="rating-choice negative" data-entry-rating="-5">−5</button>
          <button type="button" class="rating-choice negative" data-entry-rating="-4">−4</button>
          <button type="button" class="rating-choice negative" data-entry-rating="-3">−3</button>
          <button type="button" class="rating-choice negative" data-entry-rating="-2">−2</button>
          <button type="button" class="rating-choice negative" data-entry-rating="-1">−1</button>
          <button type="button" class="rating-choice neutral active" data-entry-rating="0">0</button>
          <button type="button" class="rating-choice positive" data-entry-rating="1">+1</button>
          <button type="button" class="rating-choice positive" data-entry-rating="2">+2</button>
          <button type="button" class="rating-choice positive" data-entry-rating="3">+3</button>
          <button type="button" class="rating-choice positive" data-entry-rating="4">+4</button>
          <button type="button" class="rating-choice positive" data-entry-rating="5">+5</button>
        </div>
        <input type="hidden" id="entry-rating-value" value="0" />
      </div>

      <div class="dialog-actions">
        <button type="button" class="btn secondary" id="cancel-dialog">Abbrechen</button>
        <button class="btn primary" type="submit">Speichern</button>
      </div>
    </form>
  </dialog>

  <dialog id="detail-dialog" class="dialog">
    <div class="dialog-card">
      <div class="dialog-head">
        <div>
          <p class="eyebrow" id="detail-eyebrow">TRAININGSDETAILS</p>
          <h2 id="detail-title">Training</h2>
        </div>
        <button type="button" class="icon-btn ghost" id="close-detail-dialog">×</button>
      </div>
      <div id="detail-content"></div>
      <div class="dialog-actions detail-dialog-actions">
        <button type="button" class="btn secondary" id="close-detail-bottom">Schliessen</button>
        <button type="button" class="btn secondary" id="edit-detail-entry">Bearbeiten</button>
        <button type="button" class="btn danger" id="delete-detail-entry">Eintrag löschen</button>
      </div>
    </div>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
